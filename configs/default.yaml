# Дефолтная конфигурация RAG системы
# Используется как базовая для всех стратегий

# Настройки LM Studio
lm_studio:
  url: "http://127.0.0.1:1234"
  llm_model: "qwen/qwen3-14b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.7
  max_tokens: 2000
  timeout: 300

# Настройки ChromaDB
chromadb:
  path: "./chroma_db"
  collection_name: "medical_docs_baseline"
  distance_function: "cosine"

# Настройки чанкинга
chunking:
  strategy: "chonkie"  # chonkie или langchain
  chunk_size: 512
  chunk_overlap: 50

# Настройки поиска
retrieval:
  strategy: "hybrid"  # "semantic" — только векторный, "hybrid" — векторный + BM25
  top_k: 10
  score_threshold: 0.0
  rrf_k: 60             # Константа RRF для hybrid (рекомендуется 60)
  bm25_k1: 1.5          # BM25: насыщение частоты термина (1.2–2.0)
  bm25_b: 0.75          # BM25: нормализация длины документа (0.0–1.0)

# Настройки логирования
logging:
  level: "INFO"
  log_dir: "./logs"
  rotation: "500 MB"
  retention: "10 days"

# Пути к данным
data_dir: "./data"
results_dir: "./results"
