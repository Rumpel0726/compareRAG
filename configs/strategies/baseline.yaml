# Baseline стратегия
# Базовая конфигурация для сравнения

# Настройки LM Studio
lm_studio:
  url: "http://127.0.0.1:1234"
  llm_model: "qwen/qwen3-14b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.7
  max_tokens: 2000
  timeout: 120

# Настройки ChromaDB
chromadb:
  path: "./chroma_db"
  collection_name: "medical_docs_baseline"
  distance_function: "cosine"

# Настройки чанкинга - средний размер чанка
chunking:
  strategy: "chonkie"
  chunk_size: 512  # Baseline: средний размер
  chunk_overlap: 50

# Настройки поиска
retrieval:
  strategy: "semantic"
  top_k: 5
  score_threshold: 0.0

# Настройки логирования
logging:
  level: "INFO"
  log_dir: "./logs"
  rotation: "500 MB"
  retention: "10 days"

# Пути к данным
data_dir: "./data"
results_dir: "./results/baseline"
