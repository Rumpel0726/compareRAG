# SentenceChunker — малые чанки (256 токенов)
# Разбиение по границам предложений, объединение до 256 токенов

# Настройки LM Studio
lm_studio:
  url: "http://127.0.0.1:1234"
  llm_model: "qwen/qwen3-14b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.7
  max_tokens: 2000
  timeout: 300

# Настройки ChromaDB
chromadb:
  path: "./chroma_db"
  collection_name: "medical_docs_sentence_256"
  distance_function: "cosine"

# Настройки чанкинга — SentenceChunker, малый размер
chunking:
  strategy: "sentence"
  chunk_size: 256
  chunk_overlap: 0

# Настройки поиска
retrieval:
  strategy: "semantic"   # "semantic" или "hybrid"
  top_k: 10
  score_threshold: 0.0
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75

# Настройки логирования
logging:
  level: "INFO"
  log_dir: "./logs"
  rotation: "500 MB"
  retention: "10 days"

# Пути к данным
data_dir: "./data"
results_dir: "./results/sentence_small"
