# Large Chunks стратегия
# Использует большие чанки для большего контекста

# Настройки LM Studio
lm_studio:
  url: "http://127.0.0.1:1234"
  llm_model: "qwen/qwen3-14b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.7
  max_tokens: 2000
  timeout: 300

# Настройки ChromaDB
chromadb:
  path: "./chroma_db"
  collection_name: "medical_docs_large"
  distance_function: "cosine"

# Настройки чанкинга - большие чанки
chunking:
  strategy: "chonkie"
  chunk_size: 1024  # Большие чанки для максимума контекста
  chunk_overlap: 100

# Настройки поиска
retrieval:
  strategy: "semantic"   # "semantic" или "hybrid"
  top_k: 10
  score_threshold: 0.0
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75

# Настройки логирования
logging:
  level: "INFO"
  log_dir: "./logs"
  rotation: "500 MB"
  retention: "10 days"

# Пути к данным
data_dir: "./data"
results_dir: "./results/large_chunks"
