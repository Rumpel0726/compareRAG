# TokenChunker (Chonkie) — малые чанки (256) — домен: Гражданский кодекс РФ

lm_studio:
  url: "http://127.0.0.1:1234"
  llm_model: "qwen/qwen3-14b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.7
  max_tokens: 2000
  timeout: 300

chromadb:
  path: "./chroma_db"
  collection_name: "civil_code_small"
  distance_function: "cosine"

chunking:
  strategy: "chonkie"
  chunk_size: 256
  chunk_overlap: 25

retrieval:
  strategy: "semantic"
  top_k: 10
  score_threshold: 0.0
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75

logging:
  level: "INFO"
  log_dir: "./logs"
  rotation: "500 MB"
  retention: "10 days"

data_dir: "./data/Civil_Code"
results_dir: "./results/civil_code_small"
