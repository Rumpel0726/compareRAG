# Chonkie RecursiveChunker — базовые чанки (512) — домен: документация PostgreSQL

lm_studio:
  url: "http://127.0.0.1:1234"
  llm_model: "qwen/qwen3-14b"
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  temperature: 0.7
  max_tokens: 2000
  timeout: 300

chromadb:
  path: "./chroma_db"
  collection_name: "postgresql_recursive_512"
  distance_function: "cosine"

chunking:
  strategy: "recursive"
  chunk_size: 512
  chunk_overlap: 50

retrieval:
  strategy: "semantic"
  top_k: 10
  score_threshold: 0.0
  rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75

logging:
  level: "INFO"
  log_dir: "./logs"
  rotation: "500 MB"
  retention: "10 days"

data_dir: "./data/PostrgreSQL"
results_dir: "./results/postgresql_recursive_baseline"
